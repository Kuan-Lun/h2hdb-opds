[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "h2hdb-opds"
version = "0.5.0"
description = "OPDS 2.0 HTTP service for H2HDB catalogs"
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "h2hdb>=0.25.0,<0.26",
    "pydantic>=2.13.4,<3.0.0",
    "uvicorn>=0.52.4,<1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
h2hdb-opds = "h2hdb_opds.__main__:main"

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "hatchling>=1.32.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/h2hdb-opds"
Source = "https://github.com/Kuan-Lun/h2hdb-opds"
Tracker = "https://github.com/Kuan-Lun/h2hdb-opds/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h2hdb_opds"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "UP"]
# Ruff format can intentionally retain long URLs, strings, and docstrings.
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_unreachable = true

[tool.h2h.version]
release-paths = ["LICENSE", "src/**"]
