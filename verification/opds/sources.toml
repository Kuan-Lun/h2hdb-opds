[[generators]]
name = "Trang"
coordinate = "com.thaiopensource:trang:20091111"
url = "https://repo1.maven.org/maven2/com/thaiopensource/trang/20091111/trang-20091111.jar"
sha256 = "fd1aef874d6a80913bb416704b2af62cdec727c1545cff378b32301657c085ec"
inputs = [
  "verification/opds/schemas/opds-1.2/atom.rnc",
  "verification/opds/schemas/opds-1.2/opds.rnc",
]
outputs = [
  "verification/opds/schemas/opds-1.2/atom.rng",
  "verification/opds/schemas/opds-1.2/opds-upstream.rng",
]
commands = [
  "java -jar trang-20091111.jar opds.rnc opds-upstream.rng",
]
note = "opds-upstream.rng is a direct conversion of the immutable official RNC and is compiled independently. Generated RNG closure is committed so offline gates require neither Java nor network access; the main grammar includes the adjacent generated atom.rng."

[[generators]]
name = "Strict OPDS 1.2 runtime grammar derivation"
inputs = [
  "verification/opds/schemas/opds-1.2/opds-upstream.rng",
  "verification/opds/generation/generate-runtime-rng.py",
]
outputs = ["verification/opds/schemas/opds-1.2/opds.rng"]
commands = [
  ".venv/bin/python verification/opds/generation/generate-runtime-rng.py",
]
note = "The runtime grammar changes exactly one atomUri pattern: the pinned non-normative Atom RNC spells CR and TAB as literal r and t, contrary to its own comment and RFC 4287. The deterministic generator corrects those two escapes and makes no OPDS-PSE schema exception. Validation accepts PSE only by semantically checking an original document and replacing its one exact {pageNumber} token in a validation-only copy before applying this strict grammar."

